# Dependabot: revisa dependencias con vulnerabilidades y propone PRs de actualización.
# Cubre el punto de seguridad "npm audit / dependencias al día" sin costo.
# Docs: https://docs.github.com/code-security/dependabot
version: 2
updates:
  # Dependencias de la app Next.js (carpeta web/).
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencias"]
    # Agrupa parches/menores en un solo PR para no saturar.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    # No proponer saltos de versión MAYOR de estos paquetes: un mayor de Next/React
    # trae cambios que rompen el build y exigen una migración dedicada (no un PR
    # automático). Dependabot seguirá proponiendo parches/menores (15.x, 19.x).
    # Para migrar a Next 16 más adelante se hace a mano, con pruebas.
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]

  # Acciones de GitHub (workflows de CI).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["ci"]
