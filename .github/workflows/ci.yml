name: CI

# Verifica lint, build y tests de la app (carpeta web/) en cada push y PR a main.
# No requiere secretos: el build de Next no necesita credenciales (Firebase Admin
# y demás se resuelven en runtime; sin env, los handlers responden de forma segura).

on:
  push:
    branches: [main, rediseno-frontend-v2]
  pull_request:
    branches: [main, rediseno-frontend-v2]

# Cancela ejecuciones viejas del mismo ref si llega un push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
