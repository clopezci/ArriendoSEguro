name: E2E (Playwright + axe)

# Humo multi-navegador + accesibilidad de páginas públicas. Es un workflow
# SEPARADO del CI principal: si algo aquí falla, no bloquea el gate de lint/test/
# build. Requiere descargar navegadores (playwright install), por eso va aparte.

on:
  push:
    branches: [main, rediseno-frontend-v2]
  pull_request:
    branches: [main, rediseno-frontend-v2]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: E2E
        run: npm run e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
