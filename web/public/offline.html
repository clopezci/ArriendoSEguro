<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · ArriendoSeguro</title>
    <meta name="theme-color" content="#6d28d9" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        text-align: center;
        background: #ffffff;
        border: 1px solid #cbd5e1;
        border-radius: 20px;
        padding: 32px 24px;
        box-shadow: 0 12px 30px rgba(109, 40, 217, 0.12);
      }
      .badge {
        width: 56px; height: 56px;
        margin: 0 auto 16px;
        border-radius: 16px;
        background: linear-gradient(135deg, #7c3aed, #6d28d9);
        display: flex; align-items: center; justify-content: center;
        color: #fff; font-size: 26px;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; color: #475569; margin: 0 0 20px; line-height: 1.6; }
      button {
        appearance: none; border: none; cursor: pointer;
        background: #6d28d9; color: #fff;
        font-size: 14px; font-weight: 600;
        padding: 12px 20px; border-radius: 12px;
      }
      button:focus-visible { outline: 3px solid #c4b5fd; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge" aria-hidden="true">⚖️</div>
      <h1>Estás sin conexión</h1>
      <p>
        No pudimos cargar esta página porque no hay conexión a internet. Tus borradores
        guardados siguen disponibles cuando vuelvas a estar en línea.
      </p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
